version: '3.8'

services:
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pc-builder-prod
    restart: unless-stopped
    
    ports:
      - "5173:5173"
      
    environment:
      - ORIGIN=${ORIGIN:-http://localhost:5173}
      - SERPAPI_KEY=${SERPAPI_KEY}
      
    # Implementação nativa do monitoramento de saúde do container
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
