version: '3.8'

services:
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      # Esta é a peça que faltava para conectar o .env ao Dockerfile
      args:
        - SERPAPI_KEY=${SERPAPI_KEY}
    container_name: pc-builder-prod
    restart: unless-stopped
    
    ports:
      - "3007:5173"
      
    environment:
      - ORIGIN=${ORIGIN:-http://localhost:5173}
      - SERPAPI_KEY=${SERPAPI_KEY}
      
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s